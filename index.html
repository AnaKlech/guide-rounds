<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide Dashboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#f4f6f8; --card:#fff; --card2:#fafbfc; --ink:#1a2130; --ink2:#38415a; --mut:#68718b;
    --line:#e4e7ee; --line2:#eef0f5; --accent:#2f4a7d; --accent-bg:#eaeff7;
    --red:#c62f3c; --red-bg:#fdeeef; --orange:#b45d13; --orange-bg:#fdf3e7;
    --amber:#8a6a0c; --amber-bg:#fdf7e2; --green:#1c7c46; --green-bg:#e9f7ef;
    --shadow:0 1px 2px rgba(26,33,48,.05), 0 8px 24px -16px rgba(26,33,48,.18);
    --ui:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#11141b; --card:#191d26; --card2:#1f242f; --ink:#e7ebf3; --ink2:#c3cad9; --mut:#8d97ad;
    --line:#2a3040; --line2:#232935; --accent:#8fb0e8; --accent-bg:#1c2534;
    --red:#ff8d95; --red-bg:#331c20; --orange:#f0a95e; --orange-bg:#2f2317;
    --amber:#e0c25f; --amber-bg:#2b2617; --green:#6ddc9b; --green-bg:#152a1f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --bg:#11141b; --card:#191d26; --card2:#1f242f; --ink:#e7ebf3; --ink2:#c3cad9; --mut:#8d97ad;
    --line:#2a3040; --line2:#232935; --accent:#8fb0e8; --accent-bg:#1c2534;
    --red:#ff8d95; --red-bg:#331c20; --orange:#f0a95e; --orange-bg:#2f2317;
    --amber:#e0c25f; --amber-bg:#2b2617; --green:#6ddc9b; --green-bg:#152a1f;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  img{max-width:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px 96px}
  a{color:var(--accent)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- masthead ---------- */
  header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);margin-bottom:22px}
  .top-in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;gap:14px;
    align-items:center;flex-wrap:wrap}
  .brand{font-family:var(--ui);font-weight:600;font-size:17px;letter-spacing:-.01em;
    display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex:none}
  .brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;
    color:var(--mut);letter-spacing:0}
  .back{font-family:var(--ui);font-size:13px;border:1px solid var(--line);background:var(--card);
    color:var(--ink2);border-radius:8px;padding:6px 11px;cursor:pointer}
  .back:hover{border-color:var(--ink2)}
  input[type=search]{font:14px var(--body);border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:9px;padding:8px 13px;min-width:min(260px,100%)}
  input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .toggle{font-family:var(--ui);font-size:13.5px;font-weight:500;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);border-radius:9px;padding:8px 13px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px}
  .toggle:hover{border-color:var(--green)}
  .toggle .n{font-family:var(--mono);font-size:12px;background:var(--green-bg);color:var(--green);
    border-radius:99px;padding:1px 7px}
  .toggle[aria-pressed=true]{background:var(--green-bg);border-color:var(--green);color:var(--green)}
  .toggle .n.rev{background:var(--card);color:var(--mut)}
  .toggle[aria-pressed=true]::before{content:"←";margin-right:-2px}

  /* ---------- campus picker ---------- */
  .lede-sub{color:var(--mut);font-size:14px;max-width:62ch;margin-bottom:26px}
  .grid{display:grid;margin-top:4px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .ccard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px 18px;cursor:pointer;color:inherit;font:inherit;display:block;
    box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
  .ccard:hover{border-color:var(--accent);transform:translateY(-1px)}
  .ccard .cname{font-family:var(--ui);font-weight:600;font-size:17px;letter-spacing:-.01em}

  /* ---------- tabs (inside the sticky header, so they never move) ---------- */
  .tabs{display:flex;gap:2px;max-width:1120px;margin:0 auto;padding:0 16px}
  .tabs button{font-family:var(--ui);font-size:14px;font-weight:500;background:none;border:0;
    border-bottom:2px solid transparent;color:var(--mut);padding:9px 14px;cursor:pointer;
    margin-bottom:-1px;display:flex;align-items:center;gap:8px}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--red)}
  .tabs .tn{font-family:var(--mono);font-size:11.5px;background:var(--line2);color:var(--mut);
    border-radius:99px;padding:1px 7px}
  .tabs button[aria-selected=true] .tn{background:var(--red-bg);color:var(--red)}
  .subbar{display:flex;margin:0 0 18px}

  /* ---------- accuracy tables ---------- */
  table.acc{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table.acc th{font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--mut);text-align:left;font-weight:600;padding:10px 12px;background:var(--card2);
    border-bottom:1px solid var(--line);white-space:nowrap}
  table.acc td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
  table.acc tr:last-child td{border-bottom:0}
  table.acc .nm{font-family:var(--ui);font-weight:600;display:block}
  table.acc .gd{font-size:12px;color:var(--mut)}
  table.acc td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  table.acc td.num.bad{color:var(--red);font-weight:600}
  table.acc .dt{display:block;font-size:11px;color:var(--mut);font-weight:400}
  table.acc .sc{display:block;font-family:var(--body);font-size:11.5px;color:var(--mut);
    font-weight:400}
  table.acc .sc.never{color:var(--red)}


  /* ---------- level sections ---------- */
  h2.lvl{font-family:var(--ui);font-size:13px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mut);margin:26px 0 9px;display:flex;align-items:center;gap:9px}
  h2.lvl::after{content:"";flex:1;height:1px;background:var(--line)}
  h2.lvl .c{font-family:var(--mono);letter-spacing:0;font-size:11.5px;background:var(--line2);
    color:var(--mut);border-radius:99px;padding:1px 8px;text-transform:none}
  h2.lvl .gu{font-family:var(--body);font-size:12.5px;font-weight:400;letter-spacing:0;
    text-transform:none;color:var(--ink2)}
  h2.lvl .gu::before{content:"guide ";color:var(--mut);font-size:11px}

  /* ---------- student rows ---------- */
  .stu{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
    overflow:hidden}
  .stu.open{border-color:var(--ink2);box-shadow:var(--shadow)}
  .srow{width:100%;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    background:none;border:0;color:inherit;font:inherit;text-align:left;padding:12px 15px;cursor:pointer}
  .srow:hover{background:var(--card2)}
  .srow .caret{flex:none;color:var(--mut);font-size:11px;width:11px;transition:transform .15s}
  .stu.open .srow .caret{transform:rotate(90deg)}
  .who{min-width:180px;flex:1 1 200px}
  .who .nm{font-family:var(--ui);font-weight:600;font-size:15px;letter-spacing:-.005em}
  .who .sub{font-size:12.5px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap}
  .who .sub .sid{font-family:var(--mono)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:2 1 300px}
  .chip{font-family:var(--ui);font-size:12.5px;font-weight:500;border-radius:8px;padding:3px 9px;
    white-space:nowrap;border:1px solid var(--line);background:var(--card2);color:var(--ink)}
  .chip .f{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-left:6px}
  .chip .x{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-left:6px;
    padding-left:6px;border-left:1px solid var(--line)}
  .chip .x.nodata{color:var(--mut);font-style:italic;font-family:var(--body)}
  .chip .x.low{color:var(--red);font-weight:600}
  .chip.warn{border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-bg)}
  .chip.warn .f{color:color-mix(in srgb,var(--red) 75%,var(--ink))}
  .chip.warn .x{border-left-color:color-mix(in srgb,var(--red) 30%,transparent)}
  .sevok{background:var(--green-bg);color:var(--green);border-color:color-mix(in srgb,var(--green) 22%,transparent)}

  /* ---------- expanded detail ---------- */
  .detail{border-top:1px solid var(--line);background:var(--card2);padding:4px 15px 15px}
  .loop{border-bottom:1px solid var(--line2);padding:14px 0}
  .loop:last-child{border-bottom:0;padding-bottom:4px}
  .loop-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}
  .loop-h .t{font-family:var(--ui);font-weight:600;font-size:15px}
  .loop-h .m{font-size:12.5px;color:var(--mut)}
  details.test{border:1px solid var(--line);background:var(--card);border-radius:10px;
    margin-bottom:6px;overflow:hidden}
  details.test[open]{border-color:var(--ink2)}
  details.test > summary{cursor:pointer;padding:9px 12px;display:flex;gap:10px;align-items:baseline;
    flex-wrap:wrap;font-size:13.5px;list-style:none}
  details.test > summary::-webkit-details-marker{display:none}
  details.test > summary::before{content:"▸";color:var(--mut);font-size:10px;flex:none}
  details.test[open] > summary::before{content:"▾"}
  details.test > summary:hover{background:var(--card2)}
  summary .tn{font-weight:500;flex:1 1 220px}
  summary .sc{font-family:var(--mono);font-weight:500}
  summary .dt{font-family:var(--mono);font-size:12px;color:var(--mut)}
  .tag{font-size:11px;font-family:var(--ui);letter-spacing:.03em;text-transform:uppercase;
    color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
  .tag.quiet{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);
    background:var(--accent-bg);text-transform:none;letter-spacing:0}
  .tag.moved{color:var(--green);border-color:color-mix(in srgb,var(--green) 35%,transparent);
    background:var(--green-bg);text-transform:none;letter-spacing:0}
  .offroster{font-family:var(--body);font-size:11.5px;color:var(--orange);display:block;
    font-weight:400}
  .gap{padding:2px 13px 14px;border-top:1px solid var(--line2)}
  .noreport{padding:11px 13px;font-size:13px;color:var(--mut);border-top:1px solid var(--line2)}
  .prof{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin:12px 0 2px}
  .prof .acc{font-family:var(--mono);font-size:19px;line-height:1.1}
  .prof .accl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;
    font-family:var(--ui);font-weight:600}
  .prof .mis{font-size:12.5px;color:var(--mut)}

  /* repeated gaps across a subject's sittings */
  .repeat{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);
    border-radius:10px;padding:10px 12px;margin:0 0 10px}
  .repeat .rl{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--red)}
  .repeat ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
  .repeat li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}
  .repeat .rlab{flex:1 1 200px;color:var(--ink)}
  .repeat .rn{font-family:var(--mono);font-size:11.5px;color:var(--mut);white-space:nowrap}
  .repeat.none{border-left-color:var(--line);color:var(--mut);font-size:13px}

  /* XP left in the assigned courses */
  .xp{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:10px;padding:10px 12px;margin:0 0 10px}
  .xp .rl{font-family:var(--ui);font-size:11px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--accent)}
  .xp ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
  .xp li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13.5px}
  .xp .xname{flex:1 1 230px}
  .xp .xapp{font-family:var(--mono);font-size:10.5px;color:var(--mut);margin-left:7px}
  .xp .xleft{font-family:var(--mono);font-size:13px;white-space:nowrap}
  .xp .xleft b{font-size:15px}
  .xp .xleft.low{color:var(--red)}
  .xp .xof{font-family:var(--mono);font-size:11.5px;color:var(--mut);white-space:nowrap}
  .xp .xnone,.xp .xflag{font-size:12px;color:var(--mut);font-style:italic}
  .xp .xflag{flex-basis:100%}

  /* what to work on */
  ol.cls{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
  .cl .rk{font-family:var(--mono);font-size:11.5px;color:var(--mut);border:1px solid var(--line);
    border-radius:5px;padding:0 5px;flex:none}
  .cl .root.pre{color:var(--mut)}
  details.more{margin-top:11px}
  details.more > summary{cursor:pointer;font-family:var(--ui);font-size:12.5px;font-weight:500;
    color:var(--accent);list-style:none;padding:3px 0}
  details.more > summary::-webkit-details-marker{display:none}
  details.more > summary::before{content:"+ ";font-family:var(--mono)}
  details.more[open] > summary::before{content:"− "}
  details.more > summary:hover{text-decoration:underline}
  .prose{font-size:13.5px;color:var(--ink2);max-width:74ch}
  .prose b{color:var(--ink)}
  h4.sec{font-family:var(--ui);font-size:11.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--mut);margin:16px 0 8px}
  .cl{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin-bottom:12px}
  .cl.p1{border-left-color:var(--red)}.cl.p2{border-left-color:var(--orange)}
  .cl.p3{border-left-color:var(--amber)}
  .cl .clh{font-family:var(--ui);font-weight:600;font-size:14px;display:flex;gap:8px;
    align-items:baseline;flex-wrap:wrap}
  .cl .pri{font-family:var(--mono);font-size:11px;color:var(--mut)}
  .cl .root{font-size:13px;color:var(--ink2);margin-top:3px;max-width:74ch}
  .stds{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .std{font-family:var(--mono);font-size:11px;background:var(--accent-bg);color:var(--accent);
    border-radius:5px;padding:1px 6px}
  .std[title]{cursor:help;border-bottom:1px dotted currentColor}
  .errt{display:block;font-size:10.5px;font-family:var(--ui);letter-spacing:.04em;
    text-transform:uppercase;color:var(--mut);margin-top:3px}
  table.qs{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  table.qs th{font-family:var(--ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--mut);text-align:left;font-weight:600;padding:0 10px 5px 0;border-bottom:1px solid var(--line)}
  table.qs td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line2);vertical-align:top;color:var(--ink2)}
  table.qs td:first-child{font-family:var(--mono);color:var(--mut);white-space:nowrap}
  table.qs .ans{font-family:var(--mono);font-size:12px}
  table.qs .ans .bad{color:var(--red)} table.qs .ans .good{color:var(--green)}
  table.qs .hyp{color:var(--mut);display:block;margin-top:3px}
  .tw{overflow-x:auto}
  .recs{display:flex;flex-direction:column;gap:4px;font-size:13px}
  .recs .r{color:var(--ink2)}
  .recs .r::before{content:"› ";color:var(--mut)}
  .recs .r.mut{color:var(--mut)}
  .unmet{background:var(--red-bg);border-radius:9px;padding:9px 11px;font-size:13px;
    color:var(--ink2);margin-top:12px}
  .unmet b{color:var(--red)}

  /* ---------- cleared view ---------- */
  .cleared-tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .cleared-tbl th{font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--mut);text-align:left;font-weight:600;padding:10px 12px;background:var(--card2);
    border-bottom:1px solid var(--line)}
  .cleared-tbl td{padding:9px 12px;border-bottom:1px solid var(--line2)}
  .cleared-tbl tr:last-child td{border-bottom:0}
  .cleared-tbl .nm{font-weight:600;font-family:var(--ui)}
  .cleared-tbl .num{font-size:12.5px}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:22px;
    color:var(--mut);font-size:14px;text-align:center}
  .foot{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);color:var(--mut);
    font-size:12.5px;max-width:78ch}
  .foot b{color:var(--ink2)}
  @media (max-width:640px){
    .chips{justify-content:flex-start;flex-basis:100%}
    .lede{font-size:21px}
    .cleared-tbl{font-size:12.5px}
    .cleared-tbl th,.cleared-tbl td{padding:8px 9px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <button class="back" id="back" hidden>← Campuses</button>
    <div class="brand"><span class="dot"></span>
      <span>Guide Dashboard<small id="ctx"></small></span>
    </div>
    <input type="search" id="q" placeholder="Student, guide or subject…" hidden>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</header>

<div class="wrap">
  <div class="subbar" id="subbar" hidden>
    <button class="toggle" id="esc" aria-pressed="false"><span id="escl">Cleared the loop</span> <span class="n" id="escn">0</span></button>
  </div>
  <main id="view"></main>
  <p class="foot" id="foot"></p>
</div>


<script id="appsrc" type="text/plain">(function(){
  var D = JSON.parse(document.getElementById('payload').textContent);
  var view = document.getElementById('view'), ctx = document.getElementById('ctx');
  var back = document.getElementById('back'), q = document.getElementById('q');
  var escBtn = document.getElementById('esc'), escN = document.getElementById('escn');
  var escLabel = document.getElementById('escl');
  var tabsEl = document.getElementById('tabs'), subbar = document.getElementById('subbar');
  var foot = document.getElementById('foot');
  var LEVELS = ['LL','L1','L2','MS','HS','WL',''];
  /* any level code the roster invents later still gets a section of its own */
  function levelsIn(rows){
    var extra = [];
    rows.forEach(function(r){
      var lv = r.level === undefined ? r.lv : r.level;
      if (LEVELS.indexOf(lv) === -1 && extra.indexOf(lv) === -1) extra.push(lv);
    });
    return LEVELS.concat(extra.sort());
  }
  var LEVEL_NAME = {LL:'Learning Lab', L1:'L1', L2:'L2', MS:'Middle School', HS:'High School',
                    WL:'WL', '':'Level not set'};
  var state = {campus:null, cleared:false, term:'', tab:'loops'};

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  /* report prose arrives with markdown emphasis in it */
  function rich(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>'); }
  function stds(list){
    if(!list||!list.length) return '';
    return '<div class="stds">'+list.map(function(s){
      return '<span class="std"'+(s.desc?' title="'+esc(s.desc)+'"':'')+'>'+esc(s.code)+'</span>';
    }).join('')+'</div>';
  }
  /* Under 125 XP left means the remediation is nearly used up — book pre-test coaching. */
  var XP_LOW = 125;
  function xpText(l){
    if (l.xpState === 'notpulled') return '<span class="x nodata">XP not pulled for this student</span>';
    if (l.xpState === 'nocourse') return '<span class="x nodata">no course assigned</span>';
    if (l.xpState === 'none') return '<span class="x nodata">no XP data</span>';
    var pre = l.xpState === 'atleast' ? '≥' : '';
    var star = l.xpState === 'unverified' ? '*' : '';
    return '<span class="x'+(l.xpLeft < XP_LOW ? ' low' : '')+'">'+pre+l.xpLeft+star+' XP left</span>';
  }
  function chip(l){
    var low = l.xpState !== 'none' && l.xpLeft < XP_LOW;
    return '<span class="chip'+(low?' warn':'')+'">'+esc(l.subject)+' G'+esc(l.grade)
      + '<span class="f">'+l.fails+' fails</span>'+xpText(l)+'</span>';
  }
  function pct(n){ return n==null?'—':(Math.round(n*10)/10)+'%'; }
  function d8(s){ if(!s) return '—'; var p=s.split('-');
    return p[2]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]; }
  function forCampus(c){ return D.students.filter(function(s){ return s.campus===c; }); }

  /* ---------------- campus picker ---------------- */
  function renderPicker(){
    back.hidden = true; q.hidden = true; tabsEl.hidden = true; subbar.hidden = true;
    ctx.textContent = '';
    var html = '<div class="grid">';
    D.campuses.forEach(function(c){
      html += '<button class="ccard" data-campus="'+esc(c.name)+'">'
        + '<span class="cname">'+esc(c.name)+'</span></button>';
    });
    view.innerHTML = html + '</div>';
    foot.innerHTML = '';          // the picker carries no explanatory text
  }


  /* ---------------- gap report ---------------- */
  function cluster(c, rank){
    return '<li class="cl p'+(c.pri||3)+'"><div class="clh"><span class="rk">'+rank+'</span>'
      + esc(c.name)
      + '<span class="pri">'+(c.type?esc(c.type):'')
      + (c.qn&&c.qn.length?' · Q'+c.qn.join(', Q'):'')+'</span></div>'
      + (c.root?'<div class="root">'+rich(c.root)+'</div>':'')
      + (c.pre?'<div class="root pre"><b>Needs first:</b> '+rich(c.pre)+'</div>':'')
      + stds(c.std) + '</li>';
  }

  function renderGap(g){
    var h = '';
    if (g.prof){
      h += '<div class="prof"><span class="accl">Accuracy</span>'
        + '<span class="acc">'+pct(g.prof.acc)+'</span>'
        + '<span class="mis">missed '+g.prof.missed+' of '+g.prof.tot+'</span></div>';
    }
    var cl = g.clusters || [];
    if (cl.length){
      h += '<h4 class="sec">What to work on</h4><ol class="cls">';
      cl.forEach(function(c,i){ h += cluster(c, i+1); });
      h += '</ol>';
    } else if (g.prof && g.prof.grow){
      h += '<h4 class="sec">What to work on</h4><p class="prose">'+rich(g.prof.grow)+'</p>';
    }
    if (g.recs && g.recs.length){
      h += '<h4 class="sec">Already assigned to fill it</h4><div class="recs">';
      g.recs.slice(0,6).forEach(function(r){
        h += '<div class="r">'+esc(r.lesson||'—')
          + (r.std&&r.std.length?' <span class="std">'+esc(r.std.join(', '))+'</span>':'')+'</div>';
      });
      if (g.recs.length>6) h += '<div class="r mut">+'+(g.recs.length-6)+' more lessons</div>';
      h += '</div>';
    }
    if (g.unmet && g.unmet.length){
      h += '<div class="unmet"><b>Nothing assigned for '+g.unmet.length+' gap'
        + (g.unmet.length===1?'':'s')+'</b> — '
        + g.unmet.slice(0,2).map(function(u){ return esc(u.reason||'no lesson matched'); }).join(' · ')
        + '</div>';
    }
    if (g.qs && g.qs.length){
      h += '<details class="more"><summary>The '+g.qs.length+' missed question'
        + (g.qs.length===1?'':'s')+', one by one</summary><div class="tw"><table class="qs">'
        + '<thead><tr><th>Q</th><th>Skill</th><th>Asked</th><th>Said / correct</th></tr></thead><tbody>';
      g.qs.forEach(function(x){
        h += '<tr><td>Q'+x.no+'</td>'
          + '<td><span class="std"'+(x.desc?' title="'+esc(x.desc)+'"':'')+'>'+esc(x.code||'—')+'</span></td>'
          + '<td>'+esc(x.prompt||'—')
          + (x.hyp?'<span class="hyp">'+rich(x.hyp)+'</span>':'')+'</td>'
          + '<td class="ans"><span class="bad">'+esc(x.sa||'blank')+'</span><br>'
          + '<span class="good">'+esc(x.ca||'—')+'</span></td></tr>';
      });
      h += '</tbody></table></div></details>';
    }
    return h || '<p class="prose">Report returned no detail.</p>';
  }

  function renderLoop(l){
    var h = '<section class="loop"><div class="loop-h"><span class="t">'+esc(l.subject)
      + ' · Grade '+esc(l.grade)+'</span>'
      + '<span class="chip">'+l.fails+' fails<span class="f">of '+l.attempts+' sittings</span></span>'
      + '<span class="m">latest <span class="num">'+pct(l.latest)+'</span> on '+d8(l.latestDate)
      + ' · '+l.withReport+' of '+l.tests.length+' sittings have a gap report</span>'
      + (l.quietDays>45 ? '<span class="tag quiet">no new attempt in '+l.quietDays+' days</span>' : '')
      + (l.movedOn ? '<span class="tag moved">has since passed grade '+l.movedOn.grade
          + ' in this subject ('+esc(l.movedOn.date)+')</span>' : '')
      + '</div>';
    var xp = l.xp || [];
    if (xp.length){
      h += '<div class="xp"><span class="rl">Content left to work on</span><ul>';
      xp.forEach(function(c){
        var body, cls='';
        if (c.trust==='none'){
          body = '<span class="xnone">no XP in TimeBack — launches out to the app</span>';
        } else if (c.trust==='unreliable'){
          body = '<span class="xnone">XP left can\'t be trusted for this course type</span>';
        } else {
          cls = c.left < XP_LOW ? ' low' : '';
          body = '<span class="xleft'+cls+'"><b>'+c.left+'</b> XP left</span>'
               + '<span class="xof">'+c.earned+' of '+c.total+' done</span>'
               + (c.trust==='under' ? '<span class="xflag">at least — AlphaWrite ceilings read low</span>' : '')
               + (c.trust==='hosted' ? '<span class="xflag">hosted on AlphaMath — can\'t be cross-checked</span>' : '')
               + (c.trust==='unchecked' ? '<span class="xflag">not yet checked against the course page</span>' : '');
        }
        h += '<li><span class="xname">'+esc(c.name)+'<span class="xapp">'+esc(c.app)+'</span></span>'+body+'</li>';
      });
      h += '</ul></div>';
    }
    var rp = l.repeat || {items:[]};
    if (rp.items.length){
      h += '<div class="repeat"><span class="rl">Keeps coming back</span><ul>';
      rp.items.forEach(function(r){
        h += '<li><span class="std"'+(r.desc?' title="'+esc(r.desc)+'"':'')+'>'+esc(r.code)+'</span>'
          + '<span class="rlab">'+esc(r.label)+'</span>'
          + '<span class="rn">'+r.n+' of '+rp.of+' sittings</span></li>';
      });
      h += '</ul></div>';
    } else if (rp.of>1){
      h += '<div class="repeat none">No single skill missed in more than one sitting — '
        + 'the misses move around.</div>';
    }
    l.tests.forEach(function(t){
      h += '<details class="test"><summary><span class="tn">'+esc(t.name)+'</span>'
        + '<span class="sc">'+pct(t.score)+'</span><span class="dt">'+d8(t.date)+'</span>'
        + '<span class="tag">'+(t.gap?'gap report':'no report')+'</span></summary>'
        + (t.gap ? '<div class="gap">'+renderGap(t.gap)+'</div>'
                 : '<div class="noreport">No gap analysis was generated for this sitting — usually a score '
                   + 'below the report floor, or a test that predates gap analysis.</div>')
        + '</details>';
    });
    return h + '</section>';
  }

  /* ---------------- campus view ---------------- */
  function matches(s){
    if (!state.term) return true;
    var t = state.term;
    if (s.name.toLowerCase().indexOf(t)>-1 || s.guide.toLowerCase().indexOf(t)>-1) return true;
    var pool = state.cleared ? s.escaped : s.loops;
    return pool.some(function(l){ return l.subject.toLowerCase().indexOf(t)>-1; });
  }

  function renderCampus(){
    var roll = forCampus(state.campus);
    var nCleared = roll.reduce(function(a,s){ return a+s.escaped.length; }, 0);
    var stuck = roll.filter(function(s){ return s.loops.length; });
    back.hidden = false; q.hidden = false;
    escBtn.setAttribute('aria-pressed', state.cleared ? 'true':'false');
    escLabel.textContent = state.cleared ? 'Back to the loops' : 'Cleared the loop';
    escN.textContent = state.cleared ? stuck.length : nCleared;
    escN.className = state.cleared ? 'n rev' : 'n';
    var rec = D.campuses.filter(function(c){ return c.name===state.campus; })[0] || {students:roll.length};
    ctx.textContent = state.campus + ' · ' + stuck.length + ' of ' + rec.students
      + ' students in a loop · ' + nCleared + ' cleared · tests to ' + (D.dataThrough||D.generated||'');

    // the tab bar lives in the sticky header and is only updated, never re-created,
    // so switching tabs cannot move it under the cursor
    var nAcute = D.acute.filter(function(r){ return r.campus===state.campus; }).length;
    tabsEl.hidden = false;
    tabsEl.innerHTML =
        '<button role="tab" data-tab="loops" aria-selected="'+(state.tab==='loops')+'">'
      +   'Doom loops <span class="tn">'+stuck.length+'</span></button>'
      + '<button role="tab" data-tab="acc" aria-selected="'+(state.tab==='acc')+'">'
      +   'Below 80% <span class="tn">'+nAcute+'</span></button>';
    subbar.hidden = (state.tab !== 'loops');

    if (state.tab === 'acc'){
      view.innerHTML = renderAccuracy();
      return;
    }
    if (state.cleared){ renderCleared(roll); return; }

    var rows = stuck.filter(matches);
    if (!rows.length){
      view.innerHTML = '<div class="empty">'+(stuck.length
        ? 'No student matches “'+esc(state.term)+'”.'
        : 'Nobody at '+esc(state.campus)+' is in a doom loop right now.')+'</div>';
      return;
    }
    var html = '';
    levelsIn(rows).forEach(function(lv){
      var grp = rows.filter(function(s){ return s.level===lv; });
      if (!grp.length) return;
      grp.sort(function(a,b){
        var fa = Math.max.apply(null,a.loops.map(function(l){return l.fails;}));
        var fb = Math.max.apply(null,b.loops.map(function(l){return l.fails;}));
        return fb-fa || a.name.localeCompare(b.name);
      });
      html += levelHead(lv, grp.length, 'student');
      grp.forEach(function(s){
        var chips = s.loops.map(function(l){ return chip(l); }).join('');
        html += '<article class="stu" data-k="'+esc(s.sid)+'">'
          + '<button class="srow" aria-expanded="false"><span class="caret">▶</span>'
          + '<span class="who"><span class="nm">'+esc(s.name)+'</span>'
          + '<span class="sub"><span class="sid">'+esc(s.sid)+'</span>'
          + '<span>grade '+esc(s.grade||'—')+'</span></span></span>'
          + '<span class="chips">'+chips+'</span></button>'
          + '<div class="detail" hidden></div></article>';
      });
    });
    view.innerHTML = html;
  }

  /* ---------------- below 80% ---------------- */
  function hitsTerm(r){
    if (!state.term) return true;
    var t = state.term;
    return r.name.toLowerCase().indexOf(t)>-1 || (r.guide||'').toLowerCase().indexOf(t)>-1
        || r.subject.toLowerCase().indexOf(t)>-1;
  }
  /* guides run a level, so the heading carries the name rather than every row */
  function levelHead(lv, count, unit){
    var g = (D.levelGuides || {})[state.campus + '|' + lv] || [];
    return '<h2 class="lvl">'+esc(LEVEL_NAME[lv]||lv)
      + (g.length ? '<span class="gu">'+esc(g.join(' · '))+'</span>' : '')
      + '<span class="c">'+count+' '+unit+(count===1?'':'s')+'</span></h2>';
  }
  function accCell(d){
    return '<td class="num'+(d.a<60?' bad':'')+'"><span class="dt">'+esc(d.d)+'</span>'+d.a+'%</td>';
  }
  function renderAccuracy(){
    var cov = (D.coverage||{})[state.campus] || {};
    var rows = D.acute.filter(function(r){ return r.campus===state.campus && hitsTerm(r); });

    var h = '<p class="lede-sub" style="margin:4px 0 18px">Students whose <b>last three '
      + 'sessions in a subject were all under 80%</b> — whenever those sessions happened. '
      + 'Days spent on other subjects are skipped, not counted as a break. <b>Days in a row</b> '
      + 'is how far back that run of under-80 sessions goes; the three columns are its three '
      + 'most recent days. Window '+esc(D.accWindow)+' → '+esc(cov.lastDay||'')+'.</p>';

    if (!rows.length){
      h += '<div class="empty">No student at '+esc(state.campus)+' has three consecutive '
         + 'school days under 80%'+(state.term?' matching “'+esc(state.term)+'”':'')+'.</div>';
    }
    levelsIn(rows).forEach(function(lv){
      var grp = rows.filter(function(r){ return r.level===lv; });
      if (!grp.length) return;
      h += levelHead(lv, grp.length, 'student')
        + '<div class="tw"><table class="acc"><thead><tr><th>Student</th><th>Subject</th>'
        + '<th>Day 1</th><th>Day 2</th><th>Day 3</th><th>Days in a row</th></tr></thead><tbody>';
      grp.forEach(function(r){
        h += '<tr><td><span class="nm">'+esc(r.name)+'</span>'
          + (r.onRoster ? '' : '<span class="offroster">not on the campus roster — guide unknown</span>')
          + '</td>'
          + '<td>'+esc(r.subject)+'</td>'
          + r.days.map(accCell).join('')
          + '<td class="num">'+r.streak
          + (r.lastWorked ? '<span class="sc">worked again '+esc(r.lastWorked)+'</span>' : '')
          + '</td></tr>';
      });
      h += '</tbody></table></div>';
    });



    return h;
  }

  function renderCleared(roll){
    var out = [];
    roll.forEach(function(s){
      if (!matches(s)) return;
      s.escaped.forEach(function(e){ out.push({s:s, e:e}); });
    });
    out.sort(function(a,b){ return (b.e.date||'').localeCompare(a.e.date||'')
      || a.s.name.localeCompare(b.s.name); });
    if (!out.length){
      view.innerHTML = '<div class="empty">Nobody at '+esc(state.campus)
        + ' has cleared a loop yet'+(state.term?' matching “'+esc(state.term)+'”':'')+'.</div>';
      return;
    }
    var html = '<h2 class="lvl">Cleared the loop<span class="c">'+out.length+' subject'
      + (out.length===1?'':'s')+' passed after 3+ fails</span></h2>'
      + '<div class="tw"><table class="cleared-tbl"><thead><tr><th>Student</th><th>Level</th>'
      + '<th>Guide</th><th>Subject</th><th>Grade</th><th>Fails before</th><th>Passed with</th>'
      + '</tr></thead><tbody>';
    out.forEach(function(r){
      html += '<tr><td class="nm">'+esc(r.s.name)+'</td><td>'+esc(r.s.level||'—')+'</td>'
        + '<td>'+esc(r.s.guide)+'</td><td>'+esc(r.e.subject)+'</td>'
        + '<td class="num">'+esc(r.e.grade)+'</td><td class="num">'+r.e.fails+'</td>'
        + '<td><span class="chip sevok">'+pct(r.e.score)+'<span class="f">'+d8(r.e.date)+'</span></span></td></tr>';
    });
    view.innerHTML = html + '</tbody></table></div>';
  }

  /* ---------------- interaction ---------------- */
  tabsEl.addEventListener('click', function(ev){
    var tb = ev.target.closest('button');
    if (!tb) return;
    state.tab = tb.dataset.tab; state.cleared = false;
    var want = '#/' + encodeURIComponent(state.campus) + (state.tab==='acc' ? '/below80' : '');
    if (location.hash === want) renderCampus();   // same hash fires no hashchange
    else location.hash = want;
  });

  view.addEventListener('click', function(ev){
    var cc = ev.target.closest('.ccard');
    if (cc){ state.campus = cc.dataset.campus; state.cleared=false; state.term=''; q.value='';
      state.tab='loops'; location.hash = '#/' + encodeURIComponent(state.campus); return; }
    var row = ev.target.closest('.srow');
    if (row){
      var art = row.closest('.stu'), det = art.querySelector('.detail');
      var open = art.classList.toggle('open');
      row.setAttribute('aria-expanded', open ? 'true':'false');
      if (open && !det.dataset.done){
        var s = forCampus(state.campus).filter(function(x){ return x.sid===art.dataset.k; })[0];
        det.innerHTML = s.loops.map(renderLoop).join('');
        det.dataset.done = '1';
      }
      det.hidden = !open;
    }
  });
  back.addEventListener('click', function(){ location.hash = ''; });
  escBtn.addEventListener('click', function(){ state.cleared = !state.cleared; renderCampus(); });
  q.addEventListener('input', function(){ state.term = q.value.trim().toLowerCase(); renderCampus(); });

  function route(){
    var raw = (location.hash||'').replace(/^#\/?/, '');
    var parts = raw.split('/');
    var m = '';
    try { m = decodeURIComponent(parts[0]||''); }
    catch (e) { m = parts[0]||''; }   // a stray % in the hash must not blank the page
    state.tab = parts[1]==='below80' ? 'acc' : 'loops';
    var hit = D.campuses.filter(function(c){ return c.name===m; })[0];
    if (hit){
      // arriving at a different campus — by Back/Forward or a pasted link — must not
      // inherit the previous campus's cleared view or search, or the loops look empty
      if (hit.name !== state.campus){ state.cleared = false; state.term = ''; q.value = ''; }
      state.campus = hit.name; renderCampus();
    }
    else { state.campus = null; state.cleared = false; state.term=''; q.value=''; renderPicker(); }
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  route();
})();</script>
<div id="gate">
  <form id="gateform" autocomplete="on">
    <h1>Guide Dashboard</h1>
    <p>Doom loops and accuracy for Alpha School campuses. Sign in to continue.</p>
    <label for="email">School email</label>
    <input id="email" name="username" type="email" autocomplete="username"
           placeholder="you@alpha.school" required>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="gatego">Sign in</button>
    <p id="gateerr" role="alert" hidden></p>
    <p class="fine">This page holds real student records. Do not forward the link and
      password outside the guide team.</p>
  </form>
</div>

    background:var(--bg,#f4f6f8);padding:24px}

    width:min(400px,100%);box-shadow:0 1px 2px rgba(26,33,48,.05),0 18px 40px -24px rgba(26,33,48,.3);
    display:flex;flex-direction:column;gap:6px}
  #gateform h1{font:600 20px/1.2 "Instrument Sans",-apple-system,sans-serif;margin:0 0 2px;
    letter-spacing:-.01em;color:#1a2130}
  #gateform p{margin:0 0 14px;font:14px/1.5 -apple-system,BlinkMacSystemFont,sans-serif;color:#68718b}
  #gateform label{font:600 11px/1 "Instrument Sans",-apple-system,sans-serif;letter-spacing:.08em;
    text-transform:uppercase;color:#68718b;margin-top:10px}
  #gateform input{font:15px -apple-system,BlinkMacSystemFont,sans-serif;padding:10px 12px;
    border:1px solid #e4e7ee;border-radius:9px;background:#fff;color:#1a2130}
  #gateform input:focus-visible{outline:2px solid #2f4a7d;outline-offset:1px}
  #gatego{margin-top:18px;font:600 15px "Instrument Sans",-apple-system,sans-serif;
    background:#1a2130;color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer}
  #gatego:disabled{opacity:.6;cursor:progress}
  #gateerr{color:#c62f3c;font-size:13.5px;margin:12px 0 0}
  #gateform .fine{font-size:12px;color:#8d97ad;margin:16px 0 0}

<script>
(function(){
  document.body.classList.add('locked');
  var L = JSON.parse(document.getElementById('locked').textContent);
  var f = document.getElementById('gateform'), err = document.getElementById('gateerr'),
      go = document.getElementById('gatego');
  var dec = function(b){ var s=atob(b), a=new Uint8Array(s.length);
    for (var i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; };

  async function sha16(t){
    var h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
    return [].map.call(new Uint8Array(h), function(x){ return x.toString(16).padStart(2,'0'); })
             .join('').slice(0,16);
  }

  async function unlock(email, pw){
    if (!(window.crypto && crypto.subtle) || !window.DecompressionStream)
      throw new Error('This browser is too old to open the dashboard. Use Chrome, Edge, ' +
                      'Firefox, or Safari 17 or newer.');
    if (L.emails.indexOf(await sha16(email.trim().toLowerCase())) === -1)
      throw new Error('That email is not on the guide list for this dashboard.');
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
                 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:dec(L.salt), iterations:L.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var plain;
    try {
      plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:dec(L.iv)}, key, dec(L.ct));
    } catch (e) { throw new Error('Wrong password.'); }
    var ds = new DecompressionStream('gzip');
    var text = await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
    // ask the browser to remember it — the form never hits a server, so the
    // usual save prompt may not fire on its own
    try {
      if (window.PasswordCredential && navigator.credentials)
        await navigator.credentials.store(new PasswordCredential(f));
    } catch (e) {}
    var s = document.createElement('script');
    s.id = 'payload'; s.type = 'application/json'; s.textContent = text;
    document.body.appendChild(s);
    document.getElementById('gate').remove();
    document.body.classList.remove('locked');
    var boot = document.createElement('script');
    boot.textContent = document.getElementById('appsrc').textContent;
    document.body.appendChild(boot);
  }

  f.addEventListener('submit', function(ev){
    ev.preventDefault(); err.hidden = true; go.disabled = true; go.textContent = 'Unlocking…';
    unlock(f.email.value, f.pw.value).catch(function(e){
      err.textContent = e.message; err.hidden = false;
      go.disabled = false; go.textContent = 'Sign in';
    });
  });
})();
</script>
